name: TLA+ syntax check

# Parses both frozen specs with SANY. This is a syntax check only: it proves
# the specs parse, not that any invariant holds. Full TLC runs need hours and
# 5+ GB of heap and are recorded in model/evidence/, not run here.
on:
  push:
    paths:
      - "model/Marwanta.tla"
      - "model/MarwantaDiag.tla"
  pull_request:
    paths:
      - "model/Marwanta.tla"
      - "model/MarwantaDiag.tla"

jobs:
  sany:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download TLC
        run: curl -fL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
      - name: Parse Marwanta.tla
        run: java -cp tla2tools.jar tla2sany.SANY model/Marwanta.tla
      - name: Parse MarwantaDiag.tla
        run: java -cp tla2tools.jar tla2sany.SANY model/MarwantaDiag.tla
