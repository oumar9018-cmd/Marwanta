\* DIAGNOSTIC config — NOT an authorized family run.
\* Purpose: test the revised Q-M1 hypothesis (gap-certified edge finalises
\* while its parent lacks a QC, breaking IPrefix). Labelled diagnostic per
\* the 2026-11-05 plan. MaxSteps=16 (not 15): the minimal trace is ~14-15
\* actions with uncertainty about action ordering (gap-cert before/after
\* votes), so one step of headroom guards against a false negative.
\* MaxH=3, MaxV=4 (views 0..4: genesis 0, h1 1, g 3 skipping view 2,
\* child 4), NORMAL family flags.
SPECIFICATION Spec
