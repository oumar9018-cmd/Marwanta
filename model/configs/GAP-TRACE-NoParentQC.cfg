\* DIAGNOSTIC: single gap transition (h1 view 1 -> g view 3, skipping view 2,
\* attestations + formed GapCert), parent h1 holds NO QC (no votes on h1) - the gap cert is the SOLE edge cover for g. MaxSteps=20 covers
\* the 19-action full trace (3 proposes + 9 votes + 3 attestations + Recheck
\* + FormGapCert + CandidateFinalise + FinaliseStep) with headroom.
SPECIFICATION Spec
CONSTANT
    MaxH = 3
    MaxV = 4
    DeadlineD = 10
    Quorum = 3
    MaxSteps = 20
    EnableAdversarial = FALSE
    EnableCrash = FALSE
    EnablePartition = FALSE
    E3Missing = TRUE
    E4Missing = TRUE
    E5Missing = TRUE
CONSTRAINT GapTraceNoParentQC
INVARIANT
    ISafety
    IPrefix
    IPathGateEdge
    IGC
    IQC
    IContiguousLogPrefix
    StaleNeverFinalises
