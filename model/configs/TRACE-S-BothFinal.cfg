\* DIAGNOSTIC: Trace S subspace + NotBothFinalised - prove h1 and h2 finalise consecutively (a violation of NotBothFinalised IS the proof).
\* vs SelectedTipId CHOOSE error. MaxSteps=16 covers the 15-action trace.
SPECIFICATION Spec
CONSTANT
    MaxH = 3
    MaxV = 4
    DeadlineD = 10
    Quorum = 3
    MaxSteps = 16
    EnableAdversarial = FALSE
    EnableCrash = FALSE
    EnablePartition = FALSE
    E3Missing = TRUE
    E4Missing = TRUE
    E5Missing = TRUE
CONSTRAINT TraceConstraint
INVARIANT
    ISafety
    IPrefix
    IPathGateEdge
    IGC
    IQC
    IContiguousLogPrefix
    StaleNeverFinalises
    NotBothFinalised
